# ---------------------------------------------------------- service & review
service:
  - id: clinpmx-sig
    org: ISoP/ACCP Clinical Pharmacometrics Special Interest Group
    roles:
      - { title: Chair-elect,          start: 2026-10, end: present }
      - { title: Vice-Chair,           start: 2026-01, end: 2026-10 }
      - { title: Scientific Secretary, start: 2025-01, end: 2025-12 }
    tags: [leadership, service]
    bullets:
      - id: sig-about
        text: >-
          A joint special interest group of the International Society of
          Pharmacometrics (ISoP) and the American College of Clinical Pharmacology
          (ACCP), the field's principal professional societies, focused on
          advancing pharmacometrics in patient care
      - id: sig-mission
        text: >-
          Promote application of pharmacometrics to direct patient care and foster
          an international group of scientists and clinicians across therapeutic
          areas
  - id: acop-abstracts
    org: American Conference on Pharmacometrics (ACoP) Abstract Committee
    roles:
      - { title: "Abstract Committee Member, Clinical PMX SIG Representative", start: 2025, end: present }
    years: [2025, 2026]
    tags: [leadership, service]
    bullets:
      - id: acop-role
        text: >-
          Serve as the Clinical Pharmacometrics SIG's representative to the ACoP
          abstract review committee, evaluating submitted abstracts for scientific
          merit and selecting recipients of the conference's trainee awards
      - id: acop-about
        text: ACoP is the premier annual scientific meeting in the field

peer_review:
  # Counts are computed by templates: journals = len(entries), reviews = sum(reviews).
  intro: >-
    Invited manuscript reviewer for {n_journals} international peer-reviewed
    journals across pharmacometrics, antimicrobials, and clinical medicine.
    {N_reviews} reviews {review_status}, {year_range}:
  entries:
    - { journal: Clinical Pharmacokinetics,                       years: [2026],       reviews: 1 }
    - { journal: Journal of Pharmacokinetics and Pharmacodynamics, years: [2026],       reviews: 3, note: "pharmacometrics' dedicated methodological journal" }  # 1 + 2 re-reviews
    - { journal: Clinical Microbiology and Infection,             years: [2026],       reviews: 1, note: official journal of ESCMID }
    - { journal: Antimicrobial Agents and Chemotherapy,           years: [2026],       reviews: 2, note: American Society for Microbiology }  # 1 + re-review
    - { journal: Cancer Chemotherapy and Pharmacology,            years: [2026],       reviews: 1 }
    - { journal: Frontiers in Pharmacology,                       years: [2026],       reviews: 1 }
    - { journal: Frontiers in Antibiotics,                        years: [2025],       reviews: 1 }
    - { journal: BMC Medical Research Methodology,                years: [2026],       reviews: 1 }
    - { journal: Journal of Clinical Pharmacy and Therapeutics,   years: [2025, 2026], reviews: 2 }  # incl. re-review
    - { journal: Journal of Clinical Medicine,                    years: [2025],       reviews: 1 }
    - { journal: Therapeutic Drug Monitoring,                     years: [2026],       reviews: 1 }
    - { journal: European Journal of Drug Metabolism and Pharmacokinetics, years: [2026], reviews: 1 }
    - { journal: Clinical Pharmacology & Therapeutics,             years: [2026],       reviews: 1, note: official journal of ASCPT }
  # Counting rule: every review round counts, re-reviews included.

