# career.yaml — single source of truth for resume, CV, and website.
# PUBLIC FILE: no salary, applications, recruiter notes, phone, or street address.
#
# Conventions
#   dates:   "YYYY-MM" or "YYYY"; end: present for ongoing
#   ids:     short stable slugs; variants and cross-links refer to these
#   tags:    drawn from the vocabulary below; variants filter on them
#   authors: "Tong DMH" is auto-bolded by templates
#   TODO comments mark open questions

tag_vocabulary:
  leadership:      led people, projects, collaborations, or committees
  ml:              machine learning / AI methods
  llm:             LLMs and agentic tooling
  pharmacometrics: population PK/PD, MIPD, NONMEM, simulation
  clinical-impact: deployed or changed real-world patient care
  rwe:             real-world evidence / routine clinical data at scale
  collaboration:   cross-institutional or industry partnership
  industry:        pharma / drug development facing
  communication:   presenting to decision-makers, writing, teaching
  pediatrics:      neonatal / pediatric populations
  antimicrobials:  vancomycin, aminoglycosides, antifungals
  oncology:        chemotherapy, conditioning regimens, neutropenia
  genomics:        statistical / computational genetics
  statistics:      study design, power, inference
  service:         professional society and community service

