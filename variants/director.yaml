# Director-level resume: leadership and clinical impact first, 2 pages max.
#
# Each entry in `sections` is a section id (defaults) or a mapping with options.
# Section ids: summary, experience, service, peer_review, publications,
#              presentations, skills, education, awards
#
# Bullet options (experience, service):
#   include_tags / include_ids  keep bullets matching any tag or id (omit = keep all)
#   exclude_ids                 drop specific bullets
#   tag_priority                sort bullets by first matching tag, ties keep file order
#   pin_ids                     bullets placed first, in this order
#   max_bullets                 cap per position
#   condensed                   position ids rendered as a single line, no bullets
# Publication/presentation options: select (featured and/or first_author; omit = all),
#   include_tags, exclude_ids, max_authors, max_items, numbered, show_ids,
#   note (supports {N_pubs}-style placeholders)

max_pages: 2
contacts: [location, email, website, linkedin, orcid]   # omit to show all

sections:
  - summary
  - id: experience
    include_tags: [leadership, clinical-impact, collaboration, industry, ml, llm]
    tag_priority: [leadership, clinical-impact, collaboration, industry]
    pin_ids: [astra-product, astra-validation, llm-nonmem-agent]
    max_bullets: 8
    condensed: [insight, ucsf]
  - id: service
    exclude_ids: [sig-about, sig-mission]   # org line already says what the SIG is
    max_bullets: 1
  - id: peer_review
    style: line
    highlight: 3
  - id: publications
    title: Selected Publications
    select: [featured, first_author]
    exclude_ids: [genetepi-2020-power]
    max_authors: 4
    note: "{N_pubs} peer-reviewed publications; full list in CV."
  - id: presentations
    title: Selected Presentations
    max_items: 4
    max_authors: 4
  - skills
  - id: education
    thesis: false
  - awards
